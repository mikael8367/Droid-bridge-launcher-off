name: Build APK
# reexecucao

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DroidBridge-source/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write
  issues: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar zipalign e apksigner
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner

      - name: Gerar chave de assinatura fixa (apenas na primeira vez)
        run: |
          mkdir -p signing
          if [ ! -f signing/key.pkcs8.pem ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out signing/key.pkcs8.pem
            openssl req -new -x509 -key signing/key.pkcs8.pem -out signing/cert.pem -days 9000 -subj "/CN=DroidBridge Build/O=DroidBridge/C=BR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add signing
            git commit -m "Adicionar chave de assinatura gerada automaticamente"
            git push
          fi

      - name: Compilar APK com apktool
        run: |
          wget -q -O apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          set -o pipefail
          SRC="DroidBridge-source/DroidBridge_v0.11.15(139)_src"
          java -jar apktool.jar b "$SRC" -o unsigned.apk --use-aapt2 2>&1 | tee build-aapt2.log || \
          java -jar apktool.jar b "$SRC" -o unsigned.apk 2>&1 | tee build-aapt1.log

      - name: Criar issue com o erro (se falhar)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            function tail(f) {
              if (!fs.existsSync(f)) return '(sem log)';
              const lines = fs.readFileSync(f, 'utf8').split('\n');
              return lines.slice(-120).join('\n');
            }
            const body = 'Build automático falhou (run ' + context.runId + ').\n\n' +
              '### Log aapt2 (últimas 120 linhas)\n\n```\n' + tail('build-aapt2.log').slice(0, 55000) + '\n```\n\n' +
              '### Log aapt1 (últimas 120 linhas)\n\n```\n' + tail('build-aapt1.log').slice(0, 55000) + '\n```';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Falha no build do APK (run ' + context.runId + ')',
              body: body
            });

      - name: Alinhar e assinar
        run: |
          zipalign -f -p 4 unsigned.apk aligned.apk
          apksigner sign --key signing/key.pkcs8.pem --cert signing/cert.pem --out "DroidBridge_v0.11.15-139_offline.apk" aligned.apk
          apksigner verify --print-certs "DroidBridge_v0.11.15-139_offline.apk"

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: DroidBridge-APK
          path: DroidBridge_v0.11.15-139_offline.apk
